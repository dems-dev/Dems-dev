name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # update otomatis tiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#714B67&color_dots=#ebedf0,#d9c7d4,#b38da8,#875A7B,#714B67
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00A09D&color_dots=#161b22,#0e4c4b,#00706e,#00A09D,#4fd1c5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
